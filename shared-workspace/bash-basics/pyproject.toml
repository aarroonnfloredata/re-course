# The course's own environment, managed by uv. See spec/README.md
# ("Course environment").
[project]
name = "bash-basics"
version = "0.1.0"
description = "Bash Basics: a re-course course"
requires-python = ">=3.12"
dependencies = [
    "re-course-learn[bash]",
    # From brief.yaml `dependencies`; rewritten by forge.dependencies.
]

[tool.uv]
package = false  # the course is not a Python package; uv only manages its environment

[tool.uv.sources]
# Courses live inside re-course (workspace/ or shared-workspace/), so the
# runtime is always two folders up.
re-course-learn = { path = "../../runtime", editable = true }
