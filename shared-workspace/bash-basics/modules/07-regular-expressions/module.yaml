id: 07-regular-expressions
title: Regular Expressions with grep
exercise_type: implement
language: bash
prerequisites:
- 06-cut-sort-uniq
objectives:
- Anchor a pattern to the start or end of a line, and match any character or one of a set
- Repeat parts of a pattern with *, +, ? and { }
- Match alternatives and groups with | and ( ) in grep -E
- Leave out matching lines and ignore case with grep -v and -i
