# `objective` is the 1-based number from module.yaml.
# `answer` is the 0-based index into `options`.

- id: q1
  objective: 1
  type: predict-output
  prompt: What does this print?
  code: |
    echo "GET /missing.html 404 153" > requests.txt
    awk '{ print $2 $3; print "bytes: " + $4 }' requests.txt
  options:
    - |-
      /missing.html 404
      bytes: 153
    - |-
      /missing.html404
      bytes: 153
    - |-
      /missing.html 404
      153
    - |-
      /missing.html404
      153
  answer: 3
  explanation: >-
    Two values next to each other are glued together with nothing between
    them, so $2 $3 prints /missing.html404; print $2, $3 would put a space
    between them. awk's + doesn't join strings as Python's does: it turns
    both sides into numbers, "bytes: " becomes 0, and only 153 is printed.
    To print the label, glue it on: print "bytes: " $4.

- id: q2
  objective: 1
  type: predict-output
  prompt: What does this print?
  code: |
    echo "GET /index.html 200 512" > requests.txt
    awk '{ print $NF-1 }' requests.txt
  options: ["200", "511", "3"]
  answer: 1
  explanation: >-
    $ binds tighter than any other operator, so $NF-1 is ($NF)-1: the last
    field, 512, minus 1. The field before the last, 200, needs the
    parentheses: $(NF-1). "3" is NF-1, the number of fields minus 1, which
    is what you get without the $.

- id: q3
  objective: 1
  type: predict-output
  prompt: What does this print?
  code: |
    echo "  404   /missing.html" > padded.txt
    awk '{ print $2 }' padded.txt
  options: ["/missing.html", "404", "(an empty line)"]
  answer: 0
  explanation: >-
    By default, awk separates fields by runs of spaces and tabs, and skips
    the spaces at the start of the line, so $1 is 404 and $2 is
    /missing.html. "404" treats the spaces at the start as an empty first
    field. An empty line is what cut -d ' ' -f 2 prints, because with cut
    every single space separates two fields.

- id: q4
  objective: 2
  type: spot-the-bug
  prompt: >-
    This command should print only the requests in requests.txt whose
    status, the third field, is 400 or more. It prints every line instead.
    Which command fixes it?
  code: |
    awk '$3 -ge 400' requests.txt
  options:
    - |-
      awk '$3 >= 400' requests.txt
    - |-
      awk '[[ $3 -ge 400 ]]' requests.txt
    - |-
      awk "\$3 -ge 400" requests.txt
  answer: 0
  explanation: >-
    -ge belongs to bash's [[ ]]. In awk, "400 or more" is written >=, as
    in Python. awk has no -ge: it reads $3 -ge 400 as $3 minus a variable
    called ge, which was never assigned and so is 0, with 400 glued on
    after it. For a status of 200 that gives the text 200400, and joined
    text that isn't empty counts as true, so every line is printed. [[ ]] is bash syntax too, and awk doesn't know it. Double
    quotes with \$ pass awk the same program as before, so the mistake
    stays.

- id: q5
  objective: 2
  type: predict-output
  prompt: What does this print?
  code: |
    echo "GET /errors/404.html 200 1024" > requests.txt
    echo "GET /missing.html 404 153" >> requests.txt
    echo "GET /about.html 200 404" >> requests.txt
    awk '/404/ { print $2 }' requests.txt
  options:
    - "/missing.html"
    - |-
      /errors/404.html
      /missing.html
      /about.html
    - |-
      /missing.html
      /about.html
  answer: 1
  explanation: >-
    A regular expression on its own is matched against the whole line, so
    /404/ also finds the 404 in the path and in the bytes. To test only the
    status, compare the field: $3 == 404. "/missing.html" expects /404/ to
    look at the status alone. The last option expects it to match only a
    whole field, but a regular expression matches anywhere in the line,
    like grep.

- id: q6
  objective: 3
  type: predict-output
  prompt: What does this print?
  code: |
    echo "GET /index.html 200 512" > requests.txt
    echo "GET /about.html 200 2048" >> requests.txt
    awk '$3 >= 400 { failed += $4 } END { print "failed: [" failed "]" }' requests.txt
  options: ["failed: [0]", "failed: [2560]", "failed: []"]
  answer: 2
  explanation: >-
    No line has a status of 400 or more, so the action never runs and
    failed is never assigned. A variable that was never assigned is both 0
    and the empty string, and print shows the empty string. To print 0,
    write failed + 0. "[2560]" adds up every line, but the pattern decides
    which lines reach the action, and END only prints.

- id: q7
  objective: 3
  type: spot-the-bug
  prompt: >-
    This command should print one line: the total bytes, the fourth field,
    of all requests in requests.txt. It prints a growing total after every
    line instead. Which command fixes it?
  code: |
    awk '{ total += $4; print total }' requests.txt
  options:
    - |-
      awk 'END { total += $4; print total }' requests.txt
    - |-
      awk '{ total += $4 } END { print total }' requests.txt
    - |-
      awk '{ total += $4 } { print total }' requests.txt
    - |-
      awk '{ total += $4 } END { print $total }' requests.txt
  answer: 1
  explanation: >-
    An action without a pattern runs for every line, so its print runs
    every time. Add up for every line, and print once in END, after the
    last line. Moving the adding into END too runs it only once, so it
    can't add up every line. A second action without a pattern still runs
    for every line. $total is not the variable: $ picks the field whose
    number is the value of total.
