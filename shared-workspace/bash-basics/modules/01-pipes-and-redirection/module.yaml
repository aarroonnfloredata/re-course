id: 01-pipes-and-redirection
title: Scripts, Pipes and Redirection
exercise_type: implement
language: bash
prerequisites: []
objectives:
- Write commands in a script file and run it with bash
- Send a command's output to a file with > and >>, and feed a file to it with <
- 'Keep error messages apart from output: send them to stderr with >&2, to a file with 2>, or away to /dev/null'
- Connect commands with | and narrow lines down and count them with grep, head and tail
