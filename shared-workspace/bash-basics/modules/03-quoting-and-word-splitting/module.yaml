id: 03-quoting-and-word-splitting
title: Quoting, Word Splitting and Globs
exercise_type: implement
language: bash
prerequisites:
- 02-variables-and-arguments
objectives:
- Predict how bash splits an unquoted expansion into words and expands globs in it
- Quote expansions with double quotes so values with spaces stay one argument
- Stop $ and other special characters with single quotes and backslashes
- Match file names with *, ? and [...], keeping the glob outside the quotes
- Pass the remaining arguments on unchanged with shift and "$@"
