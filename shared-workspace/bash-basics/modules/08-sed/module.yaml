id: 08-sed
title: Editing Text with sed
exercise_type: implement
language: bash
prerequisites:
- 07-regular-expressions
objectives:
- Replace text on every line with sed 's/old/new/' and the g flag
- Reuse matched parts with sed -E groups and \1
- Delete or print chosen lines with sed's d command and -n with p
- Write the result to a new file, never to the file being read
