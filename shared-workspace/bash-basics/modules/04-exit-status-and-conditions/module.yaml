id: 04-exit-status-and-conditions
title: Exit Status and Conditions
exercise_type: implement
language: bash
prerequisites:
- 03-quoting-and-word-splitting
objectives:
- Read a command's exit status with $? and end a script with a chosen status using exit
- Run a command only when another succeeds or fails, with && and ||
- Branch on a command's success with if, using grep -q as the condition
- Compare strings and numbers and check files with [[ ]]
