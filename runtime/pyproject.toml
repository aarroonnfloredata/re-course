[project]
name = "re-course-learn"
version = "0.1.0"
description = "The learn command for re-course courses: check work, see what's next, take quizzes."
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "pyyaml>=6",
]

# One extra per course language that needs more than the above. A course
# installs re-course-learn[<language>] when its language has one.
[project.optional-dependencies]
bash = ["shellcheck-py>=0.10"]

[project.scripts]
learn = "learn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
