[project]
name = "re-course-learn"
version = "0.1.0"
description = "The learn command for re-course courses: check work, see what's next, take quizzes."
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "pyyaml>=6",
]

[project.scripts]
learn = "learn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
