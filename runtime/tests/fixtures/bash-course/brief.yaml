# A one-module bash course for testing the bash plugin, the validator and
# the setup check. Not a teaching example: its lesson is short on purpose.

title: Bash Fixture
spec_version: 1
language: bash
learner: >-
  Comfortable with cd, ls and mkdir; never written a script.
goals:
  - "write a small script that takes arguments"
sources:
  - id: bashref
    url: https://www.gnu.org/software/bash/manual/bash.html
    license: "GNU Free Documentation License 1.3"
project_style: independent
dependencies: []
constraints: ["bash 3.2, as shipped with macOS"]
