# The generator's own environment (forge/). Courses have their own; see
# spec/README.md ("Course environment").
[project]
name = "re-course"
version = "0.1.0"
description = "Generates hands-on, test-graded courses from technical sources."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["forge/tests"]
pythonpath = ["."]
