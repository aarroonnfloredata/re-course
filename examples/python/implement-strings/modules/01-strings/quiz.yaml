# `objective` is the 1-based number from module.yaml.
# `answer` is the 0-based index into `options`.

- id: q1
  objective: 1
  type: predict-output
  prompt: What does this print?
  code: |
    city = "Paris"
    print(city[-3])
  options: ["i", "r", "a"]
  answer: 1
  explanation: >-
    Negative indexes count from the end, starting at -1 for the last
    character: -1 is "s", -2 is "i", -3 is "r". "i" is city[3], which ignores
    the minus sign. "a" comes from counting the last character as -0.

- id: q2
  objective: 2
  type: predict-output
  prompt: What does this print?
  code: |
    city = "Paris"
    print(city[1:3])
  options: ["ari", "Par", "ar"]
  answer: 2
  explanation: >-
    A slice includes the start and excludes the end, so city[1:3] is the
    characters at indexes 1 and 2. "ari" includes the end. "Par" counts
    positions from 1 instead of 0.

- id: q3
  objective: 2
  type: predict-output
  prompt: What does this print?
  code: |
    city = "Paris"
    print(city[3:10] + city[:2])
  options: ["IndexError: string index out of range", "isPa", "isPar"]
  answer: 1
  explanation: >-
    Slice bounds past the end are cut down to fit, so city[3:10] is "is" with
    no error. city[:2] stops before index 2, so it is "Pa", not "Par".

- id: q4
  objective: 3
  type: predict-output
  prompt: What does this print?
  code: |
    greeting = "hello"
    greeting.upper()
    print(greeting)
  options: ["HELLO", "hello", "Hello"]
  answer: 1
  explanation: >-
    upper() returns a new string and leaves the original alone. The result
    was never stored, so greeting is still "hello".

- id: q5
  objective: 4
  type: predict-output
  prompt: What does this print?
  code: |
    print("x,,y,".split(","))
  options: ["['x', 'y']", "['x', '', 'y']", "['x', '', 'y', '']"]
  answer: 2
  explanation: >-
    With a separator, split() splits on every single comma. The two commas
    in the middle give an empty string between them, and the comma at the
    end gives an empty string after it.

- id: q6
  objective: 4
  type: spot-the-bug
  prompt: >-
    first_word() should return the first word of a sentence, but
    first_word("  hello world") returns an empty string. Which return
    statement fixes it?
  code: |
    def first_word(text):
        return text.split(" ")[0]
  options:
    - 'return text.split(" ")[1]'
    - 'return text.split()[0]'
    - 'return text.strip(" ")'
  answer: 1
  explanation: >-
    split(" ") splits on every single space, so the leading spaces produce
    empty strings at the start of the list. split() with no argument ignores
    leading whitespace. Index 1 is still an empty string here, and strip()
    alone returns the whole sentence.
